name: Browser fixture regression QA

on:
  pull_request:
    paths:
      - 'nexo-v2/src/**'
      - 'nexo-v2/e2e/**'
      - 'server/worker-records.js'
      - 'server/validation.js'
      - '.github/workflows/browser-fixtures-qa.yml'
  push:
    branches: ['codex/regresion-ui-selectores-20261112']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://qa:qa@127.0.0.1:5432/nexo_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir nexo-v2 install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir nexo-v2 exec playwright install --with-deps chromium
      - run: pnpm --dir nexo-v2 run build
      - name: Navigation, worker profiles, email, evidence and permissions
        working-directory: nexo-v2
        run: >-
          pnpm exec playwright test
          e2e/app.spec.js e2e/people-list-regression.spec.js
          e2e/qa-worker-form.spec.js e2e/transversal-confirmations.spec.js
          e2e/worker-email-regression.spec.js e2e/worker-evidence-required.spec.js
          --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixtures-report
          path: nexo-v2/playwright-report
          retention-days: 7
