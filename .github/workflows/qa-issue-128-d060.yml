name: D-060 vocabulary QA #128

on:
  pull_request:
    paths:
      - 'nexo-v2/src/components/layout/Sidebar.jsx'
      - 'nexo-v2/src/pages/ImportarExportarPage.jsx'
      - 'nexo-v2/src/pages/FichaTrabajadorPage.jsx'
      - 'nexo-v2/src/pages/GestionPersonalProyectoPage.jsx'
      - 'nexo-v2/src/pages/ClientesPage.jsx'
      - 'nexo-v2/src/pages/NuevoTrabajadorPage.jsx'
      - 'nexo-v2/src/pages/CentroOperativoPage.jsx'
      - 'nexo-v2/e2e/qa-issue-128-d060-vocabulary.spec.js'
      - 'docs/qa/issue-128-d060-vocabulary.md'
      - '.github/workflows/qa-issue-128-d060.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm exec playwright test e2e/qa-issue-128-d060-vocabulary.spec.js --workers=1
