name: R03 public layout QA

on:
  pull_request:
    paths:
      - 'nexo-v2/src/styles/layout/public-layout.css'
      - 'nexo-v2/src/styles/subscriptions.css'
      - 'nexo-v2/e2e/public-typography.spec.js'
      - '.github/workflows/r03-public-layout-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-layout:
    name: Public layout and typography
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: R03 public navigation, typography and plan gutters
        run: pnpm exec playwright test e2e/public-typography.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r03-public-layout-report
          path: nexo-v2/playwright-report
          retention-days: 7
