name: Empty states QA #85

on:
  pull_request:
    paths:
      - 'nexo-v2/src/pages/**'
      - 'nexo-v2/src/components/inventory/**'
      - 'nexo-v2/src/components/ui/EmptyState*'
      - 'nexo-v2/e2e/qa-empty-state-consistency.spec.js'
      - 'nexo-v2/e2e/qa-empty-state-behavior.spec.js'
      - '.github/workflows/qa-empty-state-85.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empty-states:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec playwright test e2e/qa-empty-state-consistency.spec.js e2e/qa-empty-state-behavior.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empty-states-qa-85
          path: nexo-v2/playwright-report
          retention-days: 7
