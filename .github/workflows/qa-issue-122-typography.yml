name: Portal typography QA #122

on:
  pull_request:
    paths:
      - 'nexo-v2/src/styles/**'
      - 'nexo-v2/e2e/qa-issue-122-minimum-typography.spec.js'
      - '.github/workflows/qa-issue-122-typography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec playwright test e2e/qa-issue-122-minimum-typography.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-typography-122
          path: nexo-v2/playwright-report
          retention-days: 7
