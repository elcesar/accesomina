name: Normative statuses QA #120

on:
  pull_request:
    paths:
      - 'nexo-v2/src/services/semantic-status.js'
      - 'nexo-v2/src/components/ui/StatusBadge.jsx'
      - 'nexo-v2/src/pages/HabilitacionClientePage.jsx'
      - 'nexo-v2/src/pages/OrdenesServicioPage.jsx'
      - 'nexo-v2/src/pages/SaludOcupacionalPage.jsx'
      - 'nexo-v2/src/pages/HabilitacionesCumplimientoPage.jsx'
      - 'nexo-v2/src/pages/ExamenesPage.jsx'
      - 'nexo-v2/src/pages/ProteccionEppPage.jsx'
      - 'nexo-v2/e2e/qa-issue-120-status-catalog.spec.js'
      - '.github/workflows/qa-issue-120-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-statuses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec playwright test e2e/qa-issue-120-status-catalog.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normative-statuses-120
          path: nexo-v2/playwright-report
          retention-days: 7
