name: QA regression

on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'nexo-v2/**'
      - 'database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/qa-regression.yml'
  push:
    branches: ['codex/correcciones-regresion-qa']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://qa:qa@127.0.0.1:5432/nexo_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Complete server suite
        run: node --test --test-concurrency=2 server/test/*.test.js

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://qa:qa@127.0.0.1:5432/nexo_qa
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Contracts, opportunities, health and access regression
        run: npx playwright test e2e/contracts-regression.spec.js e2e/opportunity-transfer.spec.js e2e/prospect-rut.spec.js e2e/health-protocol.spec.js e2e/first-access-sequence.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-regression-browser-report
          path: nexo-v2/playwright-report
          retention-days: 7
