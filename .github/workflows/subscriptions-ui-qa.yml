name: Subscription interface QA

on:
  pull_request:
    paths:
      - 'nexo-v2/**'
      - '.github/workflows/subscriptions-ui-qa.yml'
  push:
    branches: ['codex/cinco-planes-suscripciones']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Desktop, mobile, registration and first access
        run: pnpm exec playwright test e2e/subscription-plans.spec.js e2e/qa-public-pages.spec.js e2e/first-access-sequence.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-interface-report
          path: nexo-v2/playwright-report
          retention-days: 7
