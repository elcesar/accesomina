name: Turnos R03 #316 QA

on:
  pull_request:
    paths:
      - 'nexo-v2/src/pages/TurnosPage.jsx'
      - 'nexo-v2/e2e/turnos-r03-316.spec.js'
      - '.github/workflows/turnos-r03-316.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turnos-r03-316:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Turnos — motivos, confirmación y recuperación de conflictos
        run: pnpm exec playwright test e2e/turnos-r03-316.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turnos-r03-316-playwright-report
          path: nexo-v2/playwright-report
          retention-days: 7
