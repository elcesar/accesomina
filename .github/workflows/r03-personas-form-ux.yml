name: R03 Personas form UX QA

on:
  pull_request:
    paths:
      - 'nexo-v2/src/components/ui/EmailInput.jsx'
      - 'nexo-v2/src/pages/NuevoTrabajadorPage.jsx'
      - 'nexo-v2/src/pages/ProspectosPage.jsx'
      - 'nexo-v2/src/services/useConfirmation.js'
      - 'nexo-v2/e2e/qa-worker-form.spec.js'
      - 'nexo-v2/e2e/opportunity-draft.spec.js'
      - '.github/workflows/r03-personas-form-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r03-personas-form-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexo-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.11.0 --activate
      - name: Install server dependencies required by the portal bundle
        run: pnpm --dir .. install --frozen-lockfile --ignore-scripts
      - name: Install portal dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: RUT, borrador de oportunidad y correo alineado
        run: >-
          pnpm exec playwright test
          e2e/qa-worker-form.spec.js
          e2e/opportunity-draft.spec.js
          e2e/email-input.spec.js
          e2e/prospect-rut.spec.js
          --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r03-personas-form-ux-report
          path: nexo-v2/playwright-report
          retention-days: 7
